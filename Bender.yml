package:
  name: cheshire
  authors:
    - "Nicole Narr <narrn@student.ethz.ch>"
    - "Christopher Reinwardt <creinwar@student.ethz.ch>"
    - "Paul Scheffler <paulsc@iis.ee.ethz.ch>"
    - "Alessandro Ottaviano <aottaviano@iis.ee.ethz.ch>"
    - "Thomas Benz <tbenz@iis.ee.ethz.ch>"

dependencies:
  apb_uart:                 { git: "https://github.com/pulp-platform/apb_uart.git",               version: 0.2.1  }
  axi:                      { git: "https://github.com/pulp-platform/axi.git",                    version: 0.39.6 }
  axi_llc:                  { git: "https://github.com/pulp-platform/axi_llc.git",                version: 0.2.1  }
  axi_riscv_atomics:        { git: "git@github.com:imissyou6534/axi_riscv_atomics.git",           rev: b80a8f92a6d9f16b49c3a13cbae5262525408c45 }
  axi_rt:                   { git: "git@github.com:imissyou6534/axi_rt.git",                      rev: 3239986094107a3c71ed3568ade86e51d5c29d17 }
  axi_vga:                  { git: "https://github.com/pulp-platform/axi_vga.git",                version: 0.1.3  }
  clic:                     { git: "https://github.com/pulp-platform/clic.git",                   version: 2.0.0  }
  clint:                    { git: "git@github.com:imissyou6534/clint.git",                       rev: 0d93c54b7669cd0f17f4194e2a6f093ede31a08b }
  common_cells:             { git: "https://github.com/pulp-platform/common_cells.git",           version: 1.33.0 }
  common_verification:      { git: "https://github.com/pulp-platform/common_verification.git",    version: 0.2.0  }
  cva6:                     { git: "git@github.com:imissyou6534/cva6.git",                        rev: 8c12cc603ac0feda3fde4c2f464f5d4a085052dd }
  ara:                      { git: "git@github.com:imissyou6534/ara.git",                         rev: bf042ed7fa2ef87dd8db821d9ebb951fd419d166 }
  iDMA:                     { git: "git@github.com:imissyou6534/iDMA.git",                        rev: 122eea2cc6576fee60c6cd8e7161c967eab6e2d9 }
  irq_router:               { git: "https://github.com/pulp-platform/irq_router.git",             version: 0.0.1-beta.1 }
  opentitan_peripherals:    { git: "git@github.com:imissyou6534/opentitan_peripherals.git",       rev: 1d5ff8b7c99a58aacc128e8d3248bd1577f5e377 }
  register_interface:       { git: "https://github.com/pulp-platform/register_interface.git",     version: 0.4.4  }
  riscv-dbg:                { git: "https://github.com/pulp-platform/riscv-dbg.git",              version: 0.8.1  }
  serial_link:              { git: "https://github.com/pulp-platform/serial_link.git",            version: 1.1.1  }
  unbent:                   { git: "https://github.com/pulp-platform/unbent.git",                 version: 0.1.6  }
  dram_rtl_sim:             { git: "https://github.com/pulp-platform/dram_rtl_sim.git",           version: 0.1.1  }

export_include_dirs:
  - hw/include

sources:
  - hw/future/UsbOhciAxi4.v
  - hw/future/spinal_usb_ohci.sv
  - target: not(rom_autoboot)
    files:
      - hw/bootrom/cheshire_bootrom.sv
  - target: rom_autoboot
    files:
      - target/rom_autoboot/cheshire_bootrom.sv
  - hw/regs/cheshire_reg_pkg.sv
  - hw/regs/cheshire_reg_top.sv
  - hw/shared_dma/cheshire_core_lrsc_guard.sv
  - hw/shared_dma/cheshire_dma_pkg.sv
  - hw/shared_dma/dma_tile_frontend.sv
  - hw/shared_dma/dma_job_scheduler.sv
  - hw/shared_dma/dma_engine_wrap.sv
  - hw/shared_dma/shared_dma_pool.sv
  - hw/shared_dma/global_ddr_fabric.sv
  - hw/shared_dma/cheshire_shared_dma_subsystem.sv
  - hw/cheshire_idma_wrap.sv
  - hw/fft/src/fft_accel_pkg.sv
  - hw/fft/src/multi_accel_router.sv
  - hw/fft/src/fft_task_ctrl.sv
  - hw/fft/src/fft_accelerator_ip.sv
  - hw/fft/rtl/bimpy.v
  - hw/fft/rtl/longbimpy.v
  - hw/fft/rtl/convround.v
  - hw/fft/rtl/hwbfly.v
  - hw/fft/rtl/butterfly.v
  - hw/fft/rtl/fftstage.v
  - hw/fft/rtl/qtrstage.v
  - hw/fft/rtl/laststage.v
  - hw/fft/rtl/bitreverse.v
  - hw/fft/rtl/fftifftmain.v
  - hw/cheshire_pkg.sv
  - hw/cheshire_axi_dw_bridge.sv
  - hw/shared_dma/cheshire_shared_dma_cfg_pkg.sv
  - hw/cheshire_soc.sv
  - hw/shared_dma/multi_tile_top.sv

  - target: shared_dma_test
    files:
      - target/sim/src/tb_shared_dma.sv
      - target/sim/src/tb_multi_tile_elab.sv

  - target: shared_dma_system_test
    files:
      - target/sim/src/tb_shared_dma_system.sv

  - target: private_spm_test
    files:
      - target/sim/src/tb_cheshire_pkg.sv
      - target/sim/src/tb_private_spm_map.sv
      - target/sim/src/tb_private_spm_system.sv

  - target: multitile_system_test
    files:
      - target/sim/src/vip_multitile.sv
      - target/sim/src/tb_multitile.sv

  - target: fft_ddr_test
    files:
      - target/sim/src/vip_multitile.sv
      - target/sim/src/tb_fft_ddr.sv

  - target: any(simulation, test)
    files:
      - target/sim/models/s25fs512s.v
      - target/sim/models/24FC1025.v
      - target/sim/src/vip_cheshire_soc.sv
      - target/sim/src/tb_cheshire_pkg.sv
      - target/sim/src/fixture_cheshire_soc.sv
      - target/sim/src/tb_cheshire_soc.sv

  - target: all(fpga, xilinx)
    files:
      - target/xilinx/src/phy_definitions.svh
      - target/xilinx/src/dram_wrapper_xilinx.sv
      - target/xilinx/src/fan_ctrl.sv
      - target/xilinx/src/cheshire_top_xilinx.sv

  - target: all(fpga, xilinx, vcu118)
    files:
      - target/xilinx/src/multi_tile_top_xilinx.sv

  - target: all(fpga, xilinx, vcu118, rom_autoboot)
    files:
      - target/xilinx/src/multi_tile_rom_top_xilinx.sv
